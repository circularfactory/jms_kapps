# A short calibration pair on the 5-module cross: one configuration, the short run's
# (`configurations/cross-short.toml`), run once with the wrapper (`uc2`) and once without it
# (`uc2-unwrapped`). Its table compares the two by the measures that need no wrapper, and gives
# the completion matcher's reads: the harness's own overhead (jms_kapps 49). It checks that a pair
# and its table work end to end on a configured GraphDB. Not a measurement, and no heavy load: the
# calibration pairs of the measured runs take their configuration and run timing, on the same
# hardware and the same versions.

[defaults]
series = "calibration"         # the series that the readers show with each number (jms_kapps 110)
boxes_per_minute = 6
warm_up_seconds = 0
window_seconds = 60
drain_bound_seconds = 120
matcher_interval_seconds = 2
transit_seconds = 3.0
retry_seconds = 1.0
heavy = false
repetitions = 1

[[sweep]]
topology = "cross"
wrapper = [true, false]

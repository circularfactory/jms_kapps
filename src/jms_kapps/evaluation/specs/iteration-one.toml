# The iteration-one spec of the measurement harness: the design of the numbers decision
# (jms_kapps 56), with the run timing of the run task (KSM 271, note of 2026-10-11). It explores the
# limits of the store under use case 2 and gives a first benchmark fast; iteration two changes this
# file, not code.
#
# 25 configurations, 5 repetitions each: 125 runs of about 12 minutes, about 25 hours.
#
# Files it names (the README of `evaluation` says how):
# - the 60- and 120-module grids, `../topologies/grid-60.json` and `../topologies/grid-120.json`,
#   committed in `topologies/`: the 12 x 5 and 24 x 5 grids that `python -m
#   jms_kapps.evaluation.grid` makes (jms_kapps 94). The 30-module grid is the shipped `grid`, the
#   5-module cross the shipped `cross`.
# - one prefill file for each topology and store size, `<topology>-<size>.ttl` in the prefills
#   folder of the command, made with `python -m jms_kapps.evaluation.prefill`. A store size is the
#   prefill's statements: about 1k, 100k, 1M and 10M. The prefill writes no module possession
#   states: the first box onto a module creates that module's state in its commit, as in a run
#   without a prefill.

[defaults]
series = "before"              # the series that the readers show with each number, "before 7"
                                # (jms_kapps 110): no key of a configuration
boxes_per_minute = 30           # a normal box rate, not heavy (jms_kapps 56)
warm_up_seconds = 60            # 1 minute, not measured
window_seconds = 300            # the measured window, 5 minutes
drain_bound_seconds = 300       # 5 minutes; a box still waiting then counts as stuck
matcher_interval_seconds = 2    # one read of finished transports every 2 s
transit_seconds = 3.0           # a module's move takes 3 s, the use case's default
retry_seconds = 1.0             # a module waits 1 s before it asks a Reserve again
heavy = false
repetitions = 5                 # over at least two time windows

# The 9 configurations near the centre come first, so that a short week still gives a complete
# one-factor set: the centre, then one factor changed at a time.

# 1. The centre: the 30-module grid, 1M, `real`, SHACL on.
[[sweep]]
topology = "grid"
prefill = "{topology}-1M.ttl"

# 2-4. The other topologies, each at 1M.
[[sweep]]
topology = ["cross", "../topologies/grid-60.json", "../topologies/grid-120.json"]
prefill = "{topology}-1M.ttl"

# 5-7. The other store sizes, each on the 30-module grid.
[[sweep]]
topology = "grid"
prefill = ["{topology}-1k.ttl", "{topology}-100k.ttl", "{topology}-10M.ttl"]

# 8. SHACL off, on the 30-module grid at 1M.
[[sweep]]
topology = "grid"
prefill = "{topology}-1M.ttl"
shacl = false

# 9. `southward`, on the 30-module grid at 1M.
[[sweep]]
topology = "grid"
prefill = "{topology}-1M.ttl"
module_strategy = "southward"
wms_strategy = "southward"

# 10. The history-on comparison at the centre, so that the history overhead is one measured number.
[[sweep]]
topology = "grid"
prefill = "{topology}-1M.ttl"
collect_history = true

# The design: three blocks, 24 configurations (16 + 4 + 4). The configurations above are among
# them, keep their places and do not run twice.

# Topology x store size, at `real` with SHACL on: 16.
[[sweep]]
topology = ["cross", "grid", "../topologies/grid-60.json", "../topologies/grid-120.json"]
prefill = ["{topology}-1k.ttl", "{topology}-100k.ttl", "{topology}-1M.ttl", "{topology}-10M.ttl"]

# SHACL off x store size, on the 30-module grid: 4.
[[sweep]]
topology = "grid"
prefill = ["{topology}-1k.ttl", "{topology}-100k.ttl", "{topology}-1M.ttl", "{topology}-10M.ttl"]
shacl = false

# `southward` x store size, on the 30-module grid: 4.
[[sweep]]
topology = "grid"
prefill = ["{topology}-1k.ttl", "{topology}-100k.ttl", "{topology}-1M.ttl", "{topology}-10M.ttl"]
module_strategy = "southward"
wms_strategy = "southward"

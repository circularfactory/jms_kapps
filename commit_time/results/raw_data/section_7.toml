# The two KAPPS configurations of the section 7 experiment, written by experiment.py from its
# parameters. Configuration 1 has SHACL on, configuration 2 SHACL off; the heartbeat level is a run
# setting, no key, so each level has a runs folder of its own.
[defaults]
series = "section-7"
topology = "grid"
prefill = "grid-1000000.ttl"
module_strategy = "real"
wms_strategy = "roundrobin"
collect_history = false
boxes_per_minute = 30
warm_up_seconds = 60
window_seconds = 300
drain_bound_seconds = 300
matcher_interval_seconds = 2
transit_seconds = 3.0
retry_seconds = 1.0
wrapper = true
heavy = false
repetitions = 15

[[sweep]]
shacl = [true, false]
